<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e33333">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body {
      margin: 0; font-family: -apple-system, Roboto, sans-serif; height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #111; color: #fff; text-align: center; padding: 20px; box-sizing: border-box;
    }
    #status { margin-bottom: 30px; font-size: 1.3em; line-height: 1.4; }
    #stopBtn {
      width: 70vw; height: 70vw; max-width: 260px; max-height: 260px; border-radius: 50%;
      background: #e33; color: #fff; font-size: 2em; font-weight: bold; border: none;
    }
    #again {
      margin-top: 30px; padding: 16px 32px; font-size: 1.1em; border-radius: 12px;
      border: none; background: #2a2; color: #fff; display: none;
    }
  </style>
</head>
<body>
  <div id="status">Iniciando...</div>
  <button id="stopBtn" style="display:none;">STOP</button>
  <button id="again">Grabar otra</button>

  <script>
    // ======== PEGÁ ACÁ TU URL DE APPS SCRIPT (termina en /exec) ========
    const APPS_SCRIPT_URL = "PEGA_TU_URL_DE_APPS_SCRIPT_ACA";
    // =====================================================================

    let mediaRecorder, chunks = [], mimeType;

    async function startRecording() {
      document.getElementById('again').style.display = 'none';
      document.getElementById('status').textContent = 'Grabando... tocá STOP para guardar';
      chunks = [];
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const options = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
        mimeType = options.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = onRecordingStopped;
        mediaRecorder.start();
        document.getElementById('stopBtn').style.display = 'block';
      } catch (err) {
        document.getElementById('status').textContent = 'No se pudo acceder al micrófono: ' + err;
      }
    }

    function onRecordingStopped() {
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('status').textContent = 'Guardando...';
      const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result.split(',')[1];
        fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ audio: base64, mime: mimeType || 'audio/webm' })
        })
          .then(r => r.json())
          .then(data => {
            document.getElementById('status').textContent = data.ok
              ? ('Guardado ✅\n' + data.titulo)
              : ('Error: ' + data.error);
            document.getElementById('again').style.display = 'inline-block';
          })
          .catch(err => {
            document.getElementById('status').textContent = 'Error de red: ' + err;
            document.getElementById('again').style.display = 'inline-block';
          });
      };
      reader.readAsDataURL(blob);
    }

    document.getElementById('stopBtn').addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    });
    document.getElementById('again').addEventListener('click', startRecording);

    startRecording();
  </script>
</body>
</html>
